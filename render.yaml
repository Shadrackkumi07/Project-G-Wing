services:
  - type: web
    name: x-analytics-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Render terminates TLS at its load balancer, so the protocol and client
      # IP arrive in X-Forwarded-* headers.
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_DOCS
        value: "true"

      - key: RATE_LIMIT_MAX
        value: "60"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: CHATGPT_RATE_LIMIT_MAX
        value: "30"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: ANALYTICS_TWEET_LIMIT
        value: "100"
      - key: TOP_TWEETS_COUNT
        value: "5"
      - key: SYNC_POST_LIMIT
        value: "500"
      - key: DATA_FILE
        value: /var/data/x-analytics.json
      - key: SYNC_INTERVAL_SECONDS
        value: "900"

      # Secrets: sync:false keeps them out of this file. Set each one in the
      # Render dashboard under the service's Environment tab.
      - key: API_KEY_HASHES
        sync: false
      - key: CHATGPT_ACCESS_TOKEN
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: OAUTH_SETUP_TOKEN
        sync: false
      - key: X_OAUTH_REDIRECT_URI
        sync: false
    disk:
      name: analytics-data
      mountPath: /var/data
      sizeGB: 1
